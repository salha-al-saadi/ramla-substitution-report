<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير الاحتياط اليومي | مدرسة رملة أم المؤمنين</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f8f6f3;color:#302b2d;font:17px Tajawal,Arial,sans-serif}main{max-width:1100px;margin:24px auto;padding:20px}.head{background:#fff;border-top:7px solid #873c50;border-radius:16px;padding:24px;box-shadow:0 3px 18px #0001;text-align:center}h1{color:#873c50;margin:4px 0 12px;font-size:clamp(23px,4vw,34px)}.meta{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;font-weight:700}.status{margin:20px 0;color:#6b5660}.wrap{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 3px 18px #0001}table{width:100%;border-collapse:collapse;min-width:700px}th{background:#873c50;color:white}td,th{padding:15px 12px;border-bottom:1px solid #eee;text-align:right}tr:nth-child(even){background:#fffcf6}.vacant{color:#b91c1c;font-weight:800}.covered{color:#166534;font-weight:800}button{border:0;border-radius:9px;background:#873c50;color:white;padding:10px 18px;font:inherit;cursor:pointer}footer{text-align:center;color:#786b70;margin:25px}.actions{display:flex;justify-content:center;gap:10px;margin-top:15px}@media print{button,.status{display:none}body{background:white}main{margin:0;max-width:none}}</style></head><body><main><header class="head"><h1>سجل متابعة وتوزيع الاحتياط اليومي</h1><div>مدرسة رملة أم المؤمنين للتعليم الأساسي (5–6)</div><div class="meta"><span id="date"></span><span id="day"></span></div><div class="actions"><button onclick="loadReport()">تحديث التقرير</button><button onclick="window.print()">طباعة</button></div></header><div class="status" id="status" role="status">جارٍ تحميل التقرير…</div><section class="wrap"><table><thead><tr><th>الحصة</th><th>الصف / الشعبة</th><th>المعلمة الغائبة</th><th>التخصص</th><th>معلمة الاحتياط</th><th>تخصص البديلة</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="7">جارٍ التحميل…</td></tr></tbody></table></section><footer>تقرير للاطلاع فقط • تحديث تلقائي كل 60 ثانية</footer></main><script>
const SUPABASE_URL='https://sqnhlgrjcszjrzcrovmj.supabase.co';
const SUPABASE_KEY='sb_publishable_oyqZ1rx1Ee3K49LoH79kFg_uD5Kk_Jr';
const el=id=>document.getElementById(id);
function localDate(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Muscat',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`}
function put(cell,value){const td=document.createElement('td');td.textContent=value??'';cell.appendChild(td);return td}
let inFlight=false;
async function loadReport(){if(inFlight)return;inFlight=true;const date=localDate();el('date').textContent='التاريخ: '+date;el('day').textContent=new Intl.DateTimeFormat('ar-OM',{timeZone:'Asia/Muscat',weekday:'long'}).format(new Date());el('status').textContent='جارٍ تحديث البيانات…';try{const u=`${SUPABASE_URL}/rest/v1/substitution_report?select=report_date,day_name,class_name,period,absent_teacher,absent_specialty,substitute_teacher,substitute_specialty,status&report_date=eq.${encodeURIComponent(date)}&order=period.asc`;const r=await fetch(u,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`},cache:'no-store'});if(!r.ok)throw Error(`تعذر قراءة التقرير (HTTP ${r.status})`);const data=await r.json();if(!Array.isArray(data))throw Error('استجابة غير متوقعة');const tbody=el('rows');tbody.replaceChildren();if(!data.length){const tr=document.createElement('tr');put(tr,'لا توجد حصص احتياط منشورة لهذا اليوم').colSpan=7;tbody.appendChild(tr)}for(const a of data){const tr=document.createElement('tr');put(tr,a.period);put(tr,a.class_name);put(tr,a.absent_teacher);put(tr,a.absent_specialty);put(tr,a.substitute_teacher);put(tr,a.substitute_specialty);const td=put(tr,a.status);td.className=a.status==='شاغرة'?'vacant':'covered';tbody.appendChild(tr)}el('status').textContent=`آخر تحديث: ${new Intl.DateTimeFormat('ar-OM',{timeZone:'Asia/Muscat',hour:'numeric',minute:'2-digit'}).format(new Date())} — ${data.length} حصة`;}catch(e){el('status').textContent='تعذر تحديث التقرير: '+e.message+'؛ ستتم إعادة المحاولة تلقائيًا.';}finally{inFlight=false}}
loadReport();setInterval(loadReport,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadReport()});
</script></body></html>
